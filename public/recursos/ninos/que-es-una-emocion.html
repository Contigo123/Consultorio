<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Qué es una emoción y qué siente mi cuerpo?</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e5;--card:#fffdf8;--ink:#2d2a4a;--soft:#6b6788;--line:#f0dfbd;--ang:#e4572e;--sad:#4a8fe0;--calm:#3fb59a;--btn:#2d2a4a;--btnink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b33;--card:#2a2748;--ink:#fdf3e0;--soft:#b9b4d6;--line:#3d3963;--btn:#fdf3e0;--btnink:#1d1b33}}
:root[data-theme="dark"]{--bg:#1d1b33;--card:#2a2748;--ink:#fdf3e0;--soft:#b9b4d6;--line:#3d3963;--btn:#fdf3e0;--btnink:#1d1b33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:19px;line-height:1.5;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:16px}
h1,h2{font-family:'Baloo 2','Nunito',system-ui,sans-serif;line-height:1.15;margin:.2em 0 .4em}
h2{font-size:1.7rem}
.dots{display:flex;gap:8px;justify-content:center;margin:6px 0 14px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.card{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:22px}
.stage{display:flex;justify-content:center;align-items:flex-end;min-height:230px;overflow:hidden}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:999px;padding:12px 24px;background:var(--btn);color:var(--btnink)}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid var(--sad);outline-offset:2px}
button[disabled]{opacity:.35;cursor:default}
.lv{display:flex;gap:8px;justify-content:center;margin:10px 0}
.lv button{width:48px;height:48px;padding:0;background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:1.1rem}
.lv button.on{background:var(--c);color:#fff;border-color:var(--c)}
.thermo{display:flex;gap:16px;align-items:center}
.tube{width:34px;height:190px;border-radius:17px;border:2px solid var(--line);background:var(--bg);position:relative;overflow:hidden;flex:none}
.fill{position:absolute;bottom:0;left:0;right:0;background:var(--c);transition:height .4s}
.say{background:var(--bg);border-radius:18px;padding:12px 16px;margin-top:8px;min-height:3.6em}
.say b{display:block;color:var(--c)}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tabs button{flex:1;background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.tabs button.on{background:var(--c);color:#fff;border-color:var(--c)}
.body-wrap{display:flex;justify-content:center}
.hot{cursor:pointer;fill:var(--c,#e9b44c);opacity:.55;transition:opacity .2s}
.hot:hover,.hot.on,.hot:focus{opacity:1;outline:none}
.breath{display:flex;justify-content:center;align-items:center;height:240px}
.ball{width:90px;height:90px;border-radius:50%;background:var(--calm);display:grid;place-items:center;color:#fff;font-weight:700;transition:transform 4s ease-in-out}
.ball.big{transform:scale(2)}
.small{color:var(--soft);font-size:.9rem}
@media (prefers-reduced-motion:reduce){.fill,.ball{transition:none}}
</style>
</head>
<body>
<main>
<div class="dots" id="dots" aria-hidden="true"></div>
<section class="card" id="page" aria-live="polite"></section>
<div class="nav"><button class="ghost" id="prev">Atrás</button><button id="next">Seguir</button></div>
</main>
<script>
var W={
 ang:{name:'Monstruo del enojo',c:'#e4572e',lines:[
  ['Tranquilo','Respiro despacio. Mi cuerpo está suave y en calma.'],
  ['Un poquito molesto','Siento calorcito en la cara y las orejas.'],
  ['Enojado','Mis puños se aprietan y mi barriga se pone dura.'],
  ['Muy enojado','Mi corazón late fuerte y quiero gritar.'],
  ['¡A punto de explotar!','Estoy rojo y tiemblo. Es hora de parar, respirar y pedir ayuda.']]},
 sad:{name:'Nube de la tristeza',c:'#4a8fe0',lines:[
  ['Tranquilo','Me siento ligero, como una nube blanca y pequeña.'],
  ['Un poquito apagado','Tengo menos ganas de jugar.'],
  ['Triste','Siento un nudo en la garganta.'],
  ['Muy triste','Mis ojos se llenan de lágrimas y mi pecho pesa.'],
  ['Tristeza enorme','Mi cuerpo pesa mucho y quiero esconderme. Es hora de pedir un abrazo.']]}
};
function monster(l){var s=.55+l*.17,b=l>=3?-14:l==2?-6:0,m=l<=1?'M60 108 Q80 120 100 108':l<=3?'M62 110 L98 110':'M60 118 Q80 98 100 118';
 return '<svg viewBox="0 0 160 170" width="'+(110+l*20)+'" role="img" aria-label="Monstruo del enojo nivel '+l+'"><path d="M30 150 Q10 80 50 45 L45 15 L65 35 Q80 28 95 35 L115 15 L110 45 Q150 80 130 150 Z" fill="hsl('+(18-l*3)+',80%,'+(66-l*7)+'%)"/><circle cx="62" cy="85" r="13" fill="#fff"/><circle cx="98" cy="85" r="13" fill="#fff"/><circle cx="64" cy="87" r="6" fill="#2d2a4a"/><circle cx="96" cy="87" r="6" fill="#2d2a4a"/><path d="M44 '+(70+b/2)+' L76 '+(78+(l>1?l*2:-4))+'" stroke="#2d2a4a" stroke-width="5" stroke-linecap="round"/><path d="M116 '+(70+b/2)+' L84 '+(78+(l>1?l*2:-4))+'" stroke="#2d2a4a" stroke-width="5" stroke-linecap="round"/><path d="'+m+'" stroke="#2d2a4a" stroke-width="5" fill="none" stroke-linecap="round"/>'+(l>=4?'<path d="M20 50 q-8-14 4-24 M140 50 q8-14-4-24" stroke="#e4572e" stroke-width="5" fill="none" stroke-linecap="round"/>':'')+'</svg>'}
function cloud(l){var m=l<=1?'M65 100 Q80 110 95 100':l<=3?'M65 106 L95 106':'M65 112 Q80 96 95 112',t='';
 for(var i=0;i<Math.max(0,l-2);i++)t+='<path d="M'+(52+i*56)+' 100 q-7 14 0 20 q7-6 0-20" fill="#7fb8f5"/>';
 return '<svg viewBox="0 0 160 170" width="'+(120+l*22)+'" role="img" aria-label="Nube de la tristeza nivel '+l+'"><g fill="hsl(212,'+(30+l*10)+'%,'+(88-l*9)+'%)"><ellipse cx="80" cy="80" rx="58" ry="34"/><circle cx="50" cy="62" r="26"/><circle cx="88" cy="50" r="30"/><circle cx="116" cy="70" r="24"/></g><circle cx="62" cy="80" r="5" fill="#2d2a4a"/><circle cx="98" cy="80" r="5" fill="#2d2a4a"/><path d="M52 66 L72 '+(70-l)+' M108 66 L88 '+(70-l)+'" stroke="#2d2a4a" stroke-width="4" stroke-linecap="round"/><path d="'+m+'" stroke="#2d2a4a" stroke-width="4" fill="none" stroke-linecap="round"/>'+t+'</svg>'}
var cur=0,lvl={ang:1,sad:1},who='ang',timer=null;
var body={cabeza:['Cabeza','Cuando me enojo o me preocupo, la cabeza puede doler o sentirse caliente.'],cara:['Cara','Se pone roja con el enojo, o los ojos se llenan de agua con la tristeza.'],garganta:['Garganta','Se hace un nudo cuando estoy triste o quiero llorar.'],corazon:['Corazón','Late más rápido cuando estoy asustado, emocionado o enojado.'],barriga:['Barriga','Cosquillas por los nervios, o un hueco cuando estoy triste.'],manos:['Manos','Se aprietan como puños cuando estoy enojado.']};
var P=[
function(){return '<h2>Hola, explorador de emociones</h2><div class="stage"><div style="display:flex;align-items:flex-end;gap:10px">'+monster(2).replace('width="144"','width="120"')+cloud(2).replace(/width="164"/,'width="130"')+'</div></div><p>Una <b>emoción</b> es algo que sientes por dentro cuando pasa algo: alegría, miedo, enojo, tristeza. Todas las emociones son normales.</p><p>Hoy conocerás al <b style="color:var(--ang)">Monstruo del enojo</b> y a la <b style="color:var(--sad)">Nube de la tristeza</b>. ¡Y aprenderás a escuchar a tu cuerpo!</p>'},
function(){var e=W[who],l=lvl[who];return '<h2>El termómetro de las emociones</h2><div class="tabs" style="--c:'+e.c+'"><button data-w="ang" class="'+(who=='ang'?'on':'')+'">Enojo</button><button data-w="sad" class="'+(who=='sad'?'on':'')+'" style="--c:#4a8fe0">Tristeza</button></div><div class="thermo" style="--c:'+e.c+'"><div class="tube" aria-hidden="true"><div class="fill" style="height:'+(l*20)+'%"></div></div><div class="stage" style="flex:1">'+(who=='ang'?monster(l):cloud(l))+'</div></div><p class="small" style="margin:6px 0 0">Toca un número para ver cómo crece.</p><div class="lv" style="--c:'+e.c+'">'+[1,2,3,4,5].map(function(n){return '<button data-l="'+n+'" class="'+(n==l?'on':'')+'" aria-label="Nivel '+n+'">'+n+'</button>'}).join('')+'</div><div class="say" style="--c:'+e.c+'"><b>'+e.lines[l-1][0]+'</b>'+e.lines[l-1][1]+'</div>'},
function(){return '<h2>¿Qué siente mi cuerpo?</h2><p>Tu cuerpo te avisa antes que tus palabras. Toca las partes del cuerpo para descubrirlo.</p><div class="body-wrap"><svg viewBox="0 0 200 300" width="190" role="group" aria-label="Cuerpo"><g fill="var(--line)"><circle cx="100" cy="50" r="38"/><rect x="62" y="92" width="76" height="110" rx="34"/><rect x="34" y="98" width="24" height="90" rx="12"/><rect x="142" y="98" width="24" height="90" rx="12"/><rect x="70" y="196" width="26" height="90" rx="12"/><rect x="104" y="196" width="26" height="90" rx="12"/></g><g style="--c:#e4572e"><circle class="hot" data-b="cabeza" cx="100" cy="22" r="14" tabindex="0"/></g><g style="--c:#f08a5d"><circle class="hot" data-b="cara" cx="100" cy="56" r="16" tabindex="0"/></g><g style="--c:#4a8fe0"><circle class="hot" data-b="garganta" cx="100" cy="94" r="11" tabindex="0"/></g><g style="--c:#e0457b"><circle class="hot" data-b="corazon" cx="112" cy="125" r="13" tabindex="0"/></g><g style="--c:#e9b44c"><circle class="hot" data-b="barriga" cx="100" cy="170" r="20" tabindex="0"/></g><g style="--c:#3fb59a"><circle class="hot" data-b="manos" cx="46" cy="190" r="14" tabindex="0"/><circle class="hot" data-b="manos" cx="154" cy="190" r="14" tabindex="0"/></g></svg></div><div class="say" id="bsay"><b>Toca un círculo de color</b></div>'},
function(){return '<h2>Cuando el monstruo o la nube crecen</h2><p>Si notas que tu termómetro sube a 4 o 5, ¡es momento de ayudar a tu cuerpo a calmarse! Prueba con una burbuja de respiración.</p><div class="breath"><div class="ball" id="ball">Listo</div></div><div style="text-align:center"><button id="go" style="background:var(--calm);color:#fff">Empezar a respirar</button></div>'},
function(){return '<h2>¡Lo lograste!</h2><div class="stage" style="gap:6px">'+monster(1).replace(/width="\d+"/,'width="110"')+cloud(1).replace(/width="\d+"/,'width="120"')+'</div><p>Ahora sabes que:</p><p>Todas las emociones son normales.<br> Tu cuerpo te avisa cómo te sientes.<br> Puedes medir qué tan grande es la emoción.<br> Respirar ayuda a que el monstruo y la nube se hagan pequeños.<br> Pedir ayuda a un adulto siempre está bien.</p>'}];
function render(){stopB();document.getElementById('page').innerHTML=P[cur]();
 document.getElementById('dots').innerHTML=P.map(function(_,i){return '<i class="'+(i==cur?'on':'')+'"></i>'}).join('');
 document.getElementById('prev').disabled=cur==0;
 var n=document.getElementById('next');n.textContent=cur==P.length-1?'Volver a empezar':'Seguir';}
function stopB(){if(timer){clearInterval(timer);timer=null}}
document.getElementById('prev').onclick=function(){if(cur>0){cur--;render()}};
document.getElementById('next').onclick=function(){cur=cur==P.length-1?0:cur+1;render()};
document.getElementById('page').addEventListener('click',function(e){
 var t=e.target.closest('[data-w],[data-l],[data-b],#go');if(!t)return;
 if(t.dataset.w){who=t.dataset.w;render()}
 else if(t.dataset.l){lvl[who]=+t.dataset.l;render()}
 else if(t.dataset.b){var d=body[t.dataset.b];document.querySelectorAll('.hot').forEach(function(h){h.classList.toggle('on',h.dataset.b==t.dataset.b)});document.getElementById('bsay').innerHTML='<b>'+d[0]+'</b>'+d[1]}
 else if(t.id=='go'){breathe(t)}});
document.getElementById('page').addEventListener('keydown',function(e){if((e.key=='Enter'||e.key==' ')&&e.target.dataset&&e.target.dataset.b){e.preventDefault();e.target.dispatchEvent(new Event('click',{bubbles:true}))}});
function breathe(btn){stopB();var ball=document.getElementById('ball'),inh=true,n=0;btn.textContent='Otra vez';
 function step(){if(n>=6){stopB();ball.classList.remove('big');ball.textContent='¡Muy bien!';return}
  ball.classList.toggle('big',inh);ball.textContent=inh?'Inhala':'Exhala';inh=!inh;n++}
 step();timer=setInterval(step,4000)}
render();
</script>
</body>
</html>
