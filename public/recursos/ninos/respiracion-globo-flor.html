<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Técnica de Respiración del Globo y de la Flor</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f7f3;--card:#fcfffe;--ink:#1f3a44;--soft:#5b7680;--line:#c6e6de;--pink:#f06a9b;--red:#e5484d;--teal:#1aa39a;--btn:#1f3a44;--btnink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10282d;--card:#183840;--ink:#e8f7f3;--soft:#a3c4c4;--line:#2a5560;--btn:#e8f7f3;--btnink:#10282d}}
:root[data-theme="dark"]{--bg:#10282d;--card:#183840;--ink:#e8f7f3;--soft:#a3c4c4;--line:#2a5560;--btn:#e8f7f3;--btnink:#10282d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:19px;line-height:1.5;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-size:1.7rem;line-height:1.15;margin:.2em 0 .4em}
.steps{display:flex;gap:6px;justify-content:center;margin:6px 0 14px}
.steps i{height:8px;flex:1;max-width:44px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--teal)}
.card{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:22px}
.stage{display:flex;justify-content:center;align-items:flex-end;gap:10px;min-height:240px;overflow:hidden}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:999px;padding:12px 24px;background:var(--btn);color:var(--btnink)}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button.go{background:var(--teal);color:#fff}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
button[disabled]{opacity:.35;cursor:default}
.tips{list-style:none;padding:0;margin:0}
.tips li{background:var(--bg);border-radius:18px;padding:12px 16px;margin:10px 0}
.say{background:var(--bg);border-radius:18px;padding:12px 16px;margin:10px 0;text-align:center;min-height:4.2em}
.say b{display:block;font-family:'Baloo 2',sans-serif;font-size:1.35rem;color:var(--teal)}
.center{text-align:center}
.small{color:var(--soft);font-size:.9rem}
svg g{transition:transform 4s ease-in-out;transform-box:fill-box}
.flower,.balloon{transform-origin:center bottom}
.flame{transform-origin:center bottom}
.in .flower{transform:scale(1.25) rotate(8deg)}
.in .balloon{transform:scale(1.7)}
.out .flame{transform:skewX(-22deg) scaleY(.55)}
.rest .flame,.in .flame{transform:none}
@media (prefers-reduced-motion:reduce){svg g{transition:none}}
</style>
</head>
<body>
<main>
<div class="steps" id="steps" aria-hidden="true"></div>
<section class="card" id="page" aria-live="polite"></section>
<div class="nav"><button class="ghost" id="prev">Atrás</button><button id="next">Seguir</button></div>
</main>
<script>
var flower='<g class="flower"><rect x="58" y="70" width="6" height="90" rx="3" fill="#3fa65a"/><ellipse cx="50" cy="120" rx="16" ry="7" fill="#3fa65a" transform="rotate(-30 50 120)"/><g fill="#f06a9b">'+[0,45,90,135,180,225,270,315].map(function(a){return '<ellipse cx="61" cy="34" rx="11" ry="20" transform="rotate('+a+' 61 61)"/>'}).join('')+'</g><circle cx="61" cy="61" r="13" fill="#ffd24d"/></g>';
var candle='<g><rect x="30" y="100" width="40" height="70" rx="6" fill="#f7e8c8" stroke="#e0c690" stroke-width="2"/><rect x="48" y="88" width="4" height="14" rx="2" fill="#2d2a4a"/><g class="flame"><path d="M50 52 C34 72 38 88 50 88 C62 88 66 72 50 52 Z" fill="#ffb02e"/><path d="M50 68 C44 76 45 85 50 85 C55 85 56 76 50 68 Z" fill="#fff2a8"/></g></g>';
var balloon='<g><g class="balloon"><ellipse cx="70" cy="70" rx="46" ry="56" fill="#e5484d"/><ellipse cx="52" cy="48" rx="9" ry="14" fill="#fff" opacity=".4"/><path d="M62 126 L78 126 L70 138 Z" fill="#c63439"/></g><path d="M70 138 Q60 156 72 170 Q80 180 70 190" stroke="var(--soft)" stroke-width="3" fill="none" stroke-linecap="round"/></g>';
function svg(inner,w,h){return '<svg viewBox="0 0 '+w+' '+h+'" height="220" role="img" aria-hidden="true">'+inner+'</svg>'}
function scene(k){
 var f=svg(flower,122,170),c=svg(candle,100,170),b=svg(balloon,140,200);
 return k=='flor'?f:k=='vela'?c:k=='globo'?b:f+c}
var T={
 flor:['Huele la flor ','Inhala por la nariz, suavemente','Saca el aire despacito'],
 vela:['Sopla la vela ','Toma aire por la nariz','Sopla por la boca, despacito. ¡Que la llama solo se incline!'],
 globo:['Infla el globo ','Llena tu barriga de aire','Deja salir el aire por la boca, despacito'],
 todo:['Flor y vela','Huele la flor: inhala por la nariz','Sopla la vela: exhala por la boca']};
var P=[
function(){return '<h2>¡Vamos a respirar jugando!</h2><div class="stage">'+svg(flower,122,170)+svg(candle,100,170)+svg(balloon,140,200)+'</div><p>Respirar despacio ayuda a que tu cuerpo se calme cuando una emoción se hace muy grande. Con tres juegos: la <b>flor</b>, la <b>vela</b> y el <b>globo</b>.</p>'},
function(){return '<h2>Prepárate</h2><ul class="tips"><li>Siéntate cómodo y suelta los hombros.</li><li>Pon una mano en tu barriga.</li><li>Cierra los ojos o mira un punto tranquilo.</li></ul><p class="small">Cuando inhales, tu mano debería subir un poquito.</p>'},
function(){return guide('flor','Paso 1: La flor','Imagina que tienes una flor muy bonita. Acércala y huélela: inhala por la nariz, suavemente.')},
function(){return guide('vela','Paso 2: La vela','Ahora tienes una vela. Sopla muy despacito por la boca, como si no quisieras apagarla.')},
function(){return guide('globo','Paso 3: El globo','Imagina un globo en tu barriga. Al inhalar se infla; al exhalar se desinfla despacito.')},
function(){return guide('todo','Paso 4: Flor y vela juntos','Huele la flor, sopla la vela. ¡Tres rondas y listo!')},
function(){return '<h2>¡Muy bien!</h2><div class="stage">'+svg(flower,122,170)+svg(balloon,140,200)+'</div><p>Cuando sientas que el enojo, la tristeza o los nervios crecen, puedes:</p><ul class="tips"><li> Oler la flor por la nariz.</li><li> Soplar la vela o desinflar el globo por la boca.</li><li>Pedir ayuda a un adulto si lo necesitas.</li></ul>'}];
function guide(k,title,intro){return '<h2>'+title+'</h2><p>'+intro+'</p><div class="stage" id="stage" data-k="'+k+'">'+scene(k)+'</div><div class="say" id="say"><b>'+T[k][0]+'</b><span class="small">Toca el botón para empezar</span></div><div class="center"><button class="go" id="go">Empezar (3 rondas)</button></div>'}
var cur=0,timer=null;
function render(){stop();document.getElementById('page').innerHTML=P[cur]();
 document.getElementById('steps').innerHTML=P.map(function(_,i){return '<i class="'+(i<=cur?'on':'')+'"></i>'}).join('');
 document.getElementById('prev').disabled=cur==0;
 document.getElementById('next').textContent=cur==P.length-1?'Volver a empezar':'Seguir'}
function stop(){if(timer){clearInterval(timer);timer=null}}
document.getElementById('prev').onclick=function(){if(cur>0){cur--;render()}};
document.getElementById('next').onclick=function(){cur=cur==P.length-1?0:cur+1;render()};
document.getElementById('page').addEventListener('click',function(e){if(e.target.id=='go')run(e.target)});
function run(btn){stop();var st=document.getElementById('stage'),say=document.getElementById('say'),k=st.dataset.k,t=T[k],tick=0,total=6*4;btn.textContent='Otra vez';
 function step(){
  if(tick>=total){stop();st.className='stage rest';say.innerHTML='<b>¡Excelente! 🎉</b><span class="small">Tu cuerpo está más tranquilo.</span>';return}
  var ph=Math.floor(tick/4),sec=tick%4+1,inh=ph%2==0;
  if(sec==1)st.className='stage '+(inh?'in':'out');
  say.innerHTML='<b>'+(inh?'Inhala':'Exhala')+' · '+sec+'</b>'+(inh?t[1]:t[2])+'<br><span class="small">Ronda '+(Math.floor(ph/2)+1)+' de 3</span>';
  tick++}
 st.className='stage rest';
 setTimeout(function(){step();timer=setInterval(step,1000)},60)}
render();
</script>
</body>
</html>
